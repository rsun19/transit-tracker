  cypress-routes:
    name: cypress-routes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm ci --prefix frontend
      - run: CYPRESS=true npm --prefix frontend run dev > frontend-dev.log 2>&1 &
      - name: Wait for frontend
        run: |
          for i in {1..45}; do
            curl -fsS http://127.0.0.1:3001 >/dev/null && exit 0
            sleep 2
          done
          echo "Frontend did not become ready"
          exit 1
      - run: node scripts/ci/ensure-cypress-tests-found.mjs routes
      - run: node scripts/ci/ensure-cypress-min-scenarios.mjs
      - run: CYPRESS_GROUP=routes node scripts/e2e/run-cypress-group.mjs --group=routes
      - name: Cypress summary
        if: always()
        run: |
          {
            echo "### cypress-routes"
            echo "- Group: routes"
            echo "- Guard: ensure-cypress-tests-found"
            echo "- Guard: ensure-cypress-min-scenarios"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Cypress artifacts (routes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-routes-artifacts
          path: |
            cypress/videos/**
            cypress/screenshots/**
            frontend-dev.log

  cypress-core-smoke:
    name: cypress-core-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm ci --prefix frontend
      - run: CYPRESS=true npm --prefix frontend run dev > frontend-dev.log 2>&1 &
      - name: Wait for frontend
        run: |
          for i in {1..45}; do
            curl -fsS http://127.0.0.1:3001 >/dev/null && exit 0
            sleep 2
          done
          echo "Frontend did not become ready"
          exit 1
      - run: node scripts/ci/ensure-cypress-tests-found.mjs core-smoke
      - run: node scripts/ci/ensure-cypress-min-scenarios.mjs
      - run: CYPRESS_GROUP=core-smoke node scripts/e2e/run-cypress-group.mjs --group=core-smoke
      - name: Cypress summary
        if: always()
        run: |
          {
            echo "### cypress-core-smoke"
            echo "- Group: core-smoke"
            echo "- Guard: ensure-cypress-tests-found"
            echo "- Guard: ensure-cypress-min-scenarios"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Cypress artifacts (core-smoke)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-core-smoke-artifacts
          path: |
            cypress/videos/**
            cypress/screenshots/**
            frontend-dev.log

  nginx-config:
    name: nginx-config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # nginx.conf references the Let's Encrypt cert, which doesn't exist in
      # CI, so generate a throwaway self-signed one at the same path. Upstream
      # hostnames need no --add-host: every proxy_pass uses a variable, which
      # nginx resolves per request, not at config load.
      - name: Generate throwaway TLS cert
        run: |
          mkdir -p ci-certs/live/www.trackthemetro.com
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -subj "/CN=www.trackthemetro.com" \
            -keyout ci-certs/live/www.trackthemetro.com/privkey.pem \
            -out ci-certs/live/www.trackthemetro.com/fullchain.pem
      - name: nginx -t (production config)
        run: |
          docker run --rm \
            -v "$PWD/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/nginx/snippets:/etc/nginx/snippets:ro" \
            -v "$PWD/ci-certs:/etc/letsencrypt:ro" \
            nginx:1.27-alpine nginx -t
      - name: nginx -t (dev config)
        run: |
          docker run --rm \
            -v "$PWD/nginx.dev.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.27-alpine nginx -t

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-main
      cancel-in-progress: true
    needs:
      - lint
      - nginx-config
      - typecheck
      - unit
      - accessibility
      - performance
      - cypress-map
      # - cypress-stops
      - cypress-routes
      - cypress-core-smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push agencies
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/agencies/Dockerfile
          target: production
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/transit-tracker-agencies:${{ github.sha }}
          cache-from: type=gha,scope=agencies
          cache-to: type=gha,mode=max,scope=agencies

      - name: Build and push routes
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/routes/Dockerfile
          target: production
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/transit-tracker-routes:${{ github.sha }}
          cache-from: type=gha,scope=routes
          cache-to: type=gha,mode=max,scope=routes

      - name: Build and push stops
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/stops/Dockerfile
          target: production
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/transit-tracker-stops:${{ github.sha }}
          cache-from: type=gha,scope=stops
          cache-to: type=gha,mode=max,scope=stops

      - name: Build and push alerts
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/alerts/Dockerfile
          target: production
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/transit-tracker-alerts:${{ github.sha }}
          cache-from: type=gha,scope=alerts
          cache-to: type=gha,mode=max,scope=alerts

      - name: Build and push vehicles
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/vehicles/Dockerfile
          target: production
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/transit-tracker-vehicles:${{ github.sha }}
          cache-from: type=gha,scope=vehicles
          cache-to: type=gha,mode=max,scope=vehicles

      - name: Build and push ingestion
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/ingestion/Dockerfile
          target: production
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/transit-tracker-ingestion:${{ github.sha }}
          cache-from: type=gha,scope=ingestion
          cache-to: type=gha,mode=max,scope=ingestion

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          target: production
          build-args: BACKEND_URL=http://nginx:8080
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/transit-tracker-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Copy deployment files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.yml,nginx.conf,nginx/snippets
          target: /opt/transit-tracker

      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_TAG: ${{ github.sha }}
          REGISTRY_OWNER: ${{ github.repository_owner }}
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_TAG,REGISTRY_OWNER,CERTBOT_EMAIL
          script: |
            cd /opt/transit-tracker

            # Update image tag and registry owner in .env
            if grep -q "^IMAGE_TAG=" .env; then
              sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=$DEPLOY_TAG|" .env
            else
              echo "IMAGE_TAG=$DEPLOY_TAG" >> .env
            fi
            if grep -q "^REGISTRY_OWNER=" .env; then
              sed -i "s|^REGISTRY_OWNER=.*|REGISTRY_OWNER=$REGISTRY_OWNER|" .env
            else
              echo "REGISTRY_OWNER=$REGISTRY_OWNER" >> .env
            fi

            docker compose pull

            # Bootstrap TLS on first deploy: check for the cert inside the
            # certbot_certs volume (not the host filesystem) then run certbot in
            # standalone mode before nginx starts. Skipped on subsequent deploys.
            if ! docker compose run --rm --entrypoint /bin/sh certbot -c "test -f /etc/letsencrypt/live/www.trackthemetro.com/fullchain.pem" >/dev/null 2>&1; then
              echo "No cert found — bootstrapping Let's Encrypt certificate..."
              docker compose run --rm --publish 80:80 --entrypoint certbot certbot certonly \
                --standalone \
                -d www.trackthemetro.com -d trackthemetro.com \
                --email "$CERTBOT_EMAIL" \
                --agree-tos --no-eff-email
            fi

            # Renew now if within 30 days of expiry (no-op otherwise), using the
            # ACME webroot served by the currently running nginx. The restart
            # below then loads the new cert. Non-fatal so a renewal hiccup
            # doesn't block the deploy.
            docker compose run --rm --entrypoint certbot certbot renew \
              --webroot -w /var/www/certbot \
              || echo "WARNING: certbot renew failed — check output above"

            # Validate the new nginx config in a throwaway container (fresh
            # mounts of the files just copied) before touching the running one
            # (runs after the cert bootstrap, since nginx -t needs the cert).
            # A broken config would otherwise take the site down on restart.
            if ! docker compose run --rm --no-deps nginx nginx -t; then
              echo "ERROR: nginx config test failed — aborting deploy"
              exit 1
            fi

            docker compose up -d --remove-orphans

            # Reload nginx so it picks up any config changes and re-resolves
            # upstream container IPs after container recreation.
            docker compose restart nginx

            # Ensure pg_trgm extension exists (idempotent — safe on every deploy)
            docker exec transit-tracker-db-1 sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"'

            docker image prune -f
