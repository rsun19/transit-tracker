# Security headers for the public HTTPS server.
#
# add_header is only inherited by a location that defines no add_header of its
# own, so any location that adds a header must include this file again.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

# Report-only for the first deploy: browsers log violations to the console
# without blocking. Switch the header name to Content-Security-Policy once the
# map tiles and pages are confirmed clean. (frame-ancestors is ignored in
# report-only mode; X-Frame-Options above covers clickjacking until then.)
add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
