worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Don't advertise the nginx version in the Server header or error pages
    server_tokens off;

    # Rate limiting zones (10MB each, keyed by client IP):
    #   api   — 1 request/second for the public /api/v1/* endpoints
    #   pages — 5 requests/second for SSR pages (each render hits the backends)
    limit_req_zone $binary_remote_addr zone=api:10m rate=1r/s;
    limit_req_zone $binary_remote_addr zone=pages:10m rate=5r/s;

    # Custom 429 response
    limit_req_status 429;

    # Use Docker's internal DNS resolver. Every proxy_pass below uses a
    # variable so upstream hostnames are re-resolved at request time, and a
    # recreated backend container doesn't cause 502s until nginx restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Catch-all: drop requests whose Host/SNI isn't one of ours (IP scans,
    # spoofed Host headers). 444 closes the connection without a response;
    # ssl_reject_handshake aborts TLS before a certificate is presented.
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        server_name _;

        ssl_reject_handshake on;

        return 444;
    }

    # HTTP: ACME challenge + redirect to HTTPS. Nothing else is served in
    # plaintext.
    server {
        listen 80;
        server_name trackthemetro.com www.trackthemetro.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://www.trackthemetro.com$request_uri;
        }
    }

    # Upstream for each /api/v1/* path prefix, shared by the internal :8080
    # server and the public HTTPS server (both include
    # snippets/api_proxy.conf). Prefixes not listed map to "" and get a 404.
    map $uri $api_upstream {
        default                   "";
        ~^/api/v1/stops           http://stops:3003;
        ~^/api/v1/(routes|trips)  http://routes:3002;
        ~^/api/v1/alerts          http://alerts:3004;
        ~^/api/v1/vehicles        http://vehicles:3005;
        ~^/api/v1/agencies        http://agencies:3001;
    }

    # Internal: API proxy for the frontend's server-side rendering
    # (BACKEND_URL=http://nginx:8080). Port 8080 is NOT published in
    # docker-compose.yml, so only containers on the compose network reach it.
    server {
        listen 8080;
        server_name _;

        location ^~ /api/v1/ {
            include /etc/nginx/snippets/api_proxy.conf;
        }

        # Used by the nginx container healthcheck
        location = /health {
            set $upstream http://agencies:3001;
            proxy_pass $upstream;
            include /etc/nginx/snippets/proxy_common.conf;
        }

        location / {
            return 404;
        }
    }

    # HTTPS
    server {
        listen 443 ssl;
        http2 on;
        server_name trackthemetro.com www.trackthemetro.com;

        ssl_certificate /etc/letsencrypt/live/www.trackthemetro.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.trackthemetro.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;

        include /etc/nginx/snippets/security_headers.conf;

        # API (routing table: the $api_upstream map above). ^~ stops the regex
        # location below from also matching these requests.
        location ^~ /api/v1/ {
            limit_req zone=api burst=10 nodelay;
            error_page 429 = @rate_limit_json;
            include /etc/nginx/snippets/api_proxy.conf;
        }

        # Case variants such as /API/V1/... miss the prefix above. Refuse them
        # here; otherwise they'd fall through to the frontend under the looser
        # page limit.
        location ~* ^/api/v1(/|$) {
            return 404;
        }

        # Health endpoint: checks agencies as representative. Rate-limited like
        # the API since it's publicly reachable; the container healthcheck
        # uses the internal :8080 server instead.
        location = /health {
            limit_req zone=api burst=10 nodelay;
            error_page 429 = @rate_limit_json;
            set $upstream http://agencies:3001;
            proxy_pass $upstream;
            include /etc/nginx/snippets/proxy_common.conf;
        }

        # Next.js build assets: content-hashed, served by the frontend with
        # immutable cache headers. Exempt from the page rate limit since one
        # page load pulls many chunks.
        location /_next/static/ {
            set $upstream http://frontend:3001;
            proxy_pass $upstream;
            include /etc/nginx/snippets/proxy_common.conf;
        }

        # Frontend proxy (SSR pages)
        location / {
            limit_req zone=pages burst=20 nodelay;
            set $upstream http://frontend:3001;
            proxy_pass $upstream;
            include /etc/nginx/snippets/proxy_common.conf;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Named location for rate limit JSON response
        location @rate_limit_json {
            default_type application/json;
            return 429 '{"error":"Rate limit exceeded","statusCode":429}';
        }
    }
}
